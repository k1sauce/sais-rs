[workspace]
resolver = "2"
members = [
    "crates/sais-rs",
    "crates/sais-golden",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Kyle Hazen <kyle@union.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kylehazen/sais-rs"
rust-version = "1.85"

[workspace.dependencies]
# parallelism
rayon = "1.10"

# errors
thiserror = "2"
anyhow = "1"

# golden-test FFI (libsais-golden only; never reachable from sais-rs).
# OpenMP off: we only need byte-correct C output for diffing, not C-side
# parallelism, and disabling it sidesteps `omp.h` discovery on macOS aarch64.
libsais-sys = { version = "=0.2.0", default-features = false }

# internal
sais-rs = { path = "crates/sais-rs" }

[profile.release]
lto = "fat"
codegen-units = 1
